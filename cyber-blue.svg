<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Jeremy Juarez / crown</title>
  <desc id="desc">Banner Cyber Blue con circuitos, un pulso luminoso animado y la frase Desarrollo web para necesidades reales.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#060B16"/><stop offset="1" stop-color="#102A43"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#2563EB"/><stop offset="1" stop-color="#67E8F9"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38BDF8" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <path d="M0 64H240L278 102H435M1200 252H984L940 208H850M950 0V65L1000 115H1200" fill="none" stroke="#38BDF8" stroke-opacity=".22" stroke-width="2"/>
  <rect x="48" y="49" width="5" height="218" rx="2" fill="url(#line)"/>
  <text x="80" y="91" font-family="Segoe UI,Arial,sans-serif" font-size="15" letter-spacing="5" fill="#67E8F9">CROWN / GITHUB</text>
  <text x="76" y="167" font-family="Segoe UI,Arial,sans-serif" font-weight="700" font-size="66" fill="#F0F9FF">Jeremy Juarez</text>
  <text x="80" y="213" font-family="Segoe UI,Arial,sans-serif" font-size="23" fill="#BAE6FD">Desarrollo web para necesidades reales.</text>
  <text x="80" y="258" font-family="Consolas,monospace" font-size="15" fill="#38BDF8">&lt; interfaces / APIs / datos &gt;</text>
  <g fill="none" stroke="url(#line)" stroke-width="3">
    <path d="M960 106L910 160L960 214M1050 106L1100 160L1050 214M1025 94L985 226"/>
    <circle cx="1005" cy="160" r="105" stroke-opacity=".13"/>
  </g>
